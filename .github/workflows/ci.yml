name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run type-check

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build-only

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mkdocseditor-web:ci
      - name: Smoke-test the image
        run: |
          docker run -d --name web -p 8080:8080 \
            -e MKDOCSEDITOR_BACKEND_URL=https://api.example.com \
            -e MKDOCSEDITOR_WIKI_URL=https://wiki.example.com \
            mkdocseditor-web:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/config.json | tee /dev/stderr | grep -q '"backendUrl": "https://api.example.com"'
          curl -fs http://localhost:8080/some/client/route | grep -q '<div id="app">'
          test "$(docker inspect --format '{{.Config.User}}' mkdocseditor-web:ci)" = "101"
          docker rm -f web

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the backend (master)
        uses: actions/checkout@v7
        with:
          repository: MkDocsEditor/MkDocsEditor-Backend
          path: e2e/.tmp/backend
      - uses: actions/setup-go@v7
        with:
          go-version-file: e2e/.tmp/backend/go.mod
          cache-dependency-path: e2e/.tmp/backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BACKEND_LOG: ${{ runner.temp }}/backend.log
      - name: Upload report and backend log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/backend.log
          retention-days: 7
