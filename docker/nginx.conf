server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;
    root   /usr/share/nginx/html;

    # Runtime configuration, generated at container start.
    location = /config.json {
        alias /tmp/mkdocseditor/config.json;
        add_header Cache-Control "no-store";
    }

    # Digital Asset Links for the Android app, from MKDOCSEDITOR_ASSETLINKS_JSON. Android fetches
    # it without following redirects; without the variable this answers 404.
    location = /.well-known/assetlinks.json {
        alias /tmp/mkdocseditor/assetlinks.json;
        types { }
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html so client-side routes work on reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
